name: Update to v0.5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace HTML files with v0.5 and update README
        run: |
          set -e
          cp "xiao-shu-nao-qu-nao-tu-cha-xun-qi.html" "index.html"
          cp "xiao-shu-nao-qu-nao-tu-cha-xun-qi.html" "Brain Altlas Guidance.html"
          rm "xiao-shu-nao-qu-nao-tu-cha-xun-qi.html"
          perl -0pi -e 's/当前版本：v0.4/当前版本：v0.5/; s/Current version: v0.4/Current version: v0.5/;' README.md
          perl -0pi -e 's!### v0.4 — 2026-11-09!### v0.5 — 2026-11-11\n- 新增深色/浅色模式切换——页面右上角图标按钮一键切换，深色模式下白底图版保留白色衬底与边框以便辨认，主题偏好会在本地记住。\n\n### v0.4 — 2026-11-09!;' README.md
          perl -0pi -e 's!### v0.4 — 9 November 2026!### v0.5 — 11 November 2026\n- Added dark/light mode toggle — switch with one click on the icon button at the top-right of the page; in dark mode, white-background plates keep a white backing and border so they remain recognisable; the theme preference is remembered locally.\n\n### v0.4 — 9 November 2026!;' README.md
          grep -q "当前版本：v0.5" README.md
          grep -q "Current version: v0.5" README.md
          grep -q "### v0.5 — 2026-11-11" README.md
          grep -q "### v0.5 — 11 November 2026" README.md
          grep -q "深色/浅色模式切换" README.md
          grep -q "Added dark/light mode toggle" README.md
          if grep -q "作者" README.md; then echo "author section present, aborting"; exit 1; fi
          cmp "index.html" "Brain Altlas Guidance.html"
          ls -l "index.html" "Brain Altlas Guidance.html"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --stat
          git commit -m "Update to v0.5: replace both HTML files with dark/light mode version and update README"
          git push
